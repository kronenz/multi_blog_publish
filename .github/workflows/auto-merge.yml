name: Auto Merge PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Configure Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
    
    - name: Check if PR is ready for merge
      id: check-pr
      run: |
        # PR이 main과 충돌하지 않는지 확인
        git fetch origin main
        if git merge-base --is-ancestor main HEAD; then
          echo "ready=true" >> $GITHUB_OUTPUT
          echo "PR is ready for merge"
        else
          echo "ready=false" >> $GITHUB_OUTPUT
          echo "PR needs to be updated with main branch"
        fi
    
    - name: Auto-merge if ready
      if: steps.check-pr.outputs.ready == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number
          });
          
          // 자동 머지 조건 확인
          const isReady = pr.mergeable && 
                         pr.mergeable_state === 'clean' && 
                         pr.draft === false;
          
          if (isReady) {
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                merge_method: 'squash',
                commit_title: `feat: ${pr.title}`,
                commit_message: `Auto-merged PR #${context.issue.number}: ${pr.title}`
              });
              
              console.log('PR successfully auto-merged');
            } catch (error) {
              console.log('Auto-merge failed:', error.message);
            }
          } else {
            console.log('PR is not ready for auto-merge');
          }
