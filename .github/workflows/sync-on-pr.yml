name: Sync on Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

jobs:
  sync-and-validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Configure Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
    
    - name: Sync with main branch
      if: github.event_name == 'pull_request'
      run: |
        # PR이 main 브랜치와 동기화되지 않은 경우 자동으로 merge
        git fetch origin main
        git checkout main
        git pull origin main
        git checkout ${{ github.head_ref }}
        
        # 충돌이 있는지 확인
        if ! git merge main --no-commit --no-ff; then
          echo "Merge conflicts detected. Attempting to resolve..."
          
          # 자동 충돌 해결 시도 (README.md 우선)
          git checkout --ours README.md 2>/dev/null || true
          git checkout --theirs README.md 2>/dev/null || true
          
          # 변경사항 스테이징
          git add .
          
          # 충돌 해결 후 커밋
          if git diff --staged --quiet; then
            echo "No changes to commit after conflict resolution"
          else
            git commit -m "chore: Auto-sync with main branch and resolve conflicts
            
            - Automatically merged changes from main branch
            - Resolved merge conflicts in documentation
            - Updated project files to maintain consistency"
          fi
        else
          echo "No conflicts detected, merge successful"
          git commit -m "chore: Auto-sync with main branch"
        fi
    
    - name: Validate documentation
      run: |
        # README.md 파일 존재 및 내용 검증
        if [ ! -f "README.md" ]; then
          echo "Error: README.md file is missing"
          exit 1
        fi
        
        # 기본 섹션들이 포함되어 있는지 확인
        required_sections=(
          "서비스 개요"
          "핵심 가치 제안"
          "주요 기능"
          "비즈니스 모델"
          "로드맵"
        )
        
        for section in "${required_sections[@]}"; do
          if ! grep -q "$section" README.md; then
            echo "Warning: Required section '$section' not found in README.md"
          fi
        done
        
        echo "Documentation validation completed"
    
    - name: Check for conflicts
      if: github.event_name == 'pull_request'
      run: |
        # PR이 main과 충돌하는지 확인
        git fetch origin main
        if ! git merge-base --is-ancestor main HEAD; then
          echo "PR is not up to date with main branch"
          echo "Please update your branch with the latest changes from main"
        else
          echo "PR is up to date with main branch"
        fi
    
    - name: Auto-update PR description
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number
          });
          
          // PR 설명에 자동 업데이트 정보 추가
          const autoUpdateInfo = `
          
          ---
          
          ## 🤖 자동 동기화 정보
          - **마지막 동기화**: ${new Date().toISOString()}
          - **상태**: main 브랜치와 자동 동기화 완료
          - **충돌 해결**: 자동으로 처리되었습니다
          `;
          
          const updatedBody = pr.body + autoUpdateInfo;
          
          await github.rest.pulls.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
            body: updatedBody
          });
    
    - name: Push changes
      if: github.event_name == 'pull_request'
      run: |
        git push origin ${{ github.head_ref }}
    
    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## ✅ 자동 동기화 완료
            
            PR이 main 브랜치와 성공적으로 동기화되었습니다.
            
            **처리된 작업:**
            - main 브랜치의 최신 변경사항과 병합
            - 충돌 해결 (있는 경우)
            - 문서 검증 완료
            - PR 설명 업데이트
            
            이제 PR을 안전하게 머지할 수 있습니다.`
          });

  notify-on-conflict:
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'pull_request'
    
    steps:
    - name: Notify about sync failure
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## ⚠️ 자동 동기화 실패
            
            PR과 main 브랜치 간의 동기화 중 문제가 발생했습니다.
            
            **수동 해결 방법:**
            1. 로컬에서 다음 명령어 실행:
               \`\`\`bash
               git checkout main
               git pull origin main
               git checkout your-feature-branch
               git merge main
               \`\`\`
            2. 충돌 해결 후 푸시
            3. PR 다시 열기
            
            또는 관리자에게 문의하세요.`
          });
